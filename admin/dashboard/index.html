<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Pixel Alchemy - CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
:root {
    --bg: #faf8f4;
    --card: #ffffff;
    --border: #f0ede8;
    --charcoal: #1a1f2e;
    --charcoal-light: #2a2f3e;
    --terracotta: #e07856;
    --sage: #8ba888;
    --lavender: #b5a6c8;
    --clay: #c4a68a;
    --red: #e05c5c;
    --green: #5cbe7c;
    --gray: #888;
    --gray-light: #aaa;

    --font: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-display: 'Bricolage Grotesque', system-ui, sans-serif;

    --r: 16px;
    --shadow: 0 2px 12px rgba(26,31,46,0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body { font-family: var(--font); background: var(--bg); color: var(--charcoal); min-height: 100vh; }

/* ── PASSWORD ── */
.gate {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--charcoal);
    display: flex; align-items: center; justify-content: center;
}
.gate.hidden { display: none; }
.gate-box {
    background: var(--bg); border-radius: var(--r);
    padding: 2.5rem; width: 360px; max-width: 95vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center;
}
.gate-box h1 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; margin-bottom: 0.3rem; }
.gate-box p { color: var(--gray); font-size: 0.82rem; margin-bottom: 1.5rem; }
.gate-box input {
    width: 100%; padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 8px; font-family: var(--font); font-size: 1rem;
    outline: none; margin-bottom: 0.5rem;
}
.gate-box input:focus { border-color: var(--terracotta); }
.gate-error { color: var(--red); font-size: 0.78rem; min-height: 1.2em; margin-bottom: 0.8rem; }
.gate-btn {
    width: 100%; padding: 12px;
    background: var(--charcoal); color: #fff;
    border: none; border-radius: 8px;
    font-family: var(--font); font-size: 1rem; font-weight: 600;
    cursor: pointer;
}
.gate-btn:hover { opacity: 0.85; }

/* ── LAYOUT ── */
.layout { display: none; flex-direction: column; min-height: 100vh; }
.layout.visible { display: flex; }

.header {
    background: var(--charcoal); color: #fff;
    padding: 1rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
}
.header-brand { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; }
.header-sub { font-size: 0.75rem; color: #aaa; }
.header-right { font-size: 0.72rem; color: #888; text-align: right; }

.main { flex: 1; padding: 1.5rem 2rem; max-width: 1100px; margin: 0 auto; width: 100%; }

.section { margin-bottom: 2.5rem; }
.section-title {
    font-family: var(--font-display); font-size: 1.25rem; font-weight: 700;
    margin-bottom: 1rem; padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--border);
}

/* ── KPIs ── */
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.8rem;
}
.kpi {
    background: var(--card); border-radius: var(--r);
    padding: 1rem 0.8rem;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    text-align: center;
}
.kpi-label { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gray); margin-bottom: 0.4rem; }
.kpi-value { font-family: var(--font-display); font-size: 2rem; font-weight: 700; line-height: 1; }
.kpi-sub { font-size: 0.68rem; color: var(--gray-light); margin-top: 0.3rem; }

/* ── FUNNEL ── */
.card { background: var(--card); border-radius: var(--r); padding: 1.2rem; box-shadow: var(--shadow); border: 1px solid var(--border); }
.card-title { font-family: var(--font-display); font-size: 0.95rem; font-weight: 700; margin-bottom: 1rem; color: var(--charcoal-light); }

.funnel-stage { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.5rem; }
.funnel-label { font-size: 0.78rem; font-weight: 500; width: 110px; flex-shrink: 0; }
.funnel-bar-wrap { flex: 1; height: 26px; background: var(--border); border-radius: 6px; overflow: hidden; }
.funnel-bar { height: 100%; border-radius: 6px; display: flex; align-items: center; padding-left: 10px; transition: width 1.2s ease; min-width: 36px; }
.funnel-bar span { font-size: 0.72rem; font-weight: 700; color: #fff; }
.funnel-count { font-size: 0.78rem; font-weight: 600; width: 35px; text-align: right; flex-shrink: 0; }

.note-box {
    background: #fef8f0; border: 1px solid #f5d9a8;
    border-radius: 8px; padding: 0.7rem 1rem;
    font-size: 0.78rem; color: #7a4a10; margin-top: 1rem; line-height: 1.5;
}

/* ── TWO COL ── */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
@media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

/* ── NICHE ── */
.niche-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
.niche-name { font-size: 0.75rem; width: 110px; flex-shrink: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.niche-bar-wrap { flex: 1; height: 18px; background: var(--border); border-radius: 4px; overflow: hidden; }
.niche-bar-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; padding: 0 6px; }
.niche-bar-fill span { font-size: 0.68rem; font-weight: 700; color: #fff; }
.niche-count { font-size: 0.75rem; font-weight: 600; width: 30px; text-align: right; flex-shrink: 0; }

/* ── MONTHLY ── */
.monthly-bars { display: flex; align-items: flex-end; gap: 1rem; height: 110px; padding-top: 0.5rem; }
.month-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
.month-bar-wrap { width: 100%; height: 80px; background: var(--border); border-radius: 6px 6px 0 0; overflow: hidden; display: flex; align-items: flex-end; }
.month-bar { width: 100%; background: var(--charcoal); border-radius: 6px 6px 0 0; transition: height 1s ease; min-height: 4px; }
.month-label { font-size: 0.7rem; font-weight: 600; color: var(--gray); }
.month-count-label { font-size: 0.8rem; font-weight: 700; }

/* ── NOTION STATUS ── */
.status-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.4rem; }
.status-name { font-size: 0.75rem; width: 130px; flex-shrink: 0; font-weight: 500; }
.status-bar-wrap { flex: 1; height: 16px; background: var(--border); border-radius: 4px; overflow: hidden; }
.status-bar { height: 100%; border-radius: 4px; background: var(--lavender); }
.status-count { font-size: 0.75rem; font-weight: 600; width: 30px; text-align: right; }

/* ── ACTIVITY ── */
.activity-list { max-height: 350px; overflow-y: auto; }
.activity-item { display: flex; gap: 0.7rem; padding: 0.6rem 0; border-bottom: 1px solid var(--border); font-size: 0.78rem; }
.activity-item:last-child { border-bottom: none; }
.activity-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.dot-green { background: var(--green); }
.dot-terracotta { background: var(--terracotta); }
.dot-sage { background: var(--sage); }
.dot-clay { background: var(--clay); }
.activity-msg { flex: 1; line-height: 1.4; color: var(--charcoal); }
.activity-date { color: var(--gray-light); font-size: 0.7rem; white-space: nowrap; }

/* ── PRD ── */
.prd-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.8rem; }
.prd-stat { background: var(--card); border-radius: var(--r); padding: 1rem; box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center; }
.prd-stat-value { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; }
.prd-stat-label { font-size: 0.68rem; color: var(--gray); margin-top: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }

.footer { text-align: center; padding: 1.2rem; font-size: 0.72rem; color: var(--gray-light); border-top: 1px solid var(--border); }
    </style>
</head>
<body>

<!-- PASSWORD -->
<div class="gate" id="gate">
    <div class="gate-box">
        <h1>Pixel Alchemy</h1>
        <p>CRM de Prospeccao. Insira a senha.</p>
        <input type="password" id="gateInput" placeholder="Senha" autocomplete="off">
        <div class="gate-error" id="gateError"></div>
        <button class="gate-btn" id="gateBtn">Entrar</button>
    </div>
</div>

<!-- DASHBOARD -->
<div class="layout" id="layout">
    <header class="header">
        <div>
            <div class="header-brand">Pixel Alchemy</div>
            <div class="header-sub">CRM de Prospeccao</div>
        </div>
        <div class="header-right" id="updatedAt"></div>
    </header>

    <main class="main">

        <!-- KPIs -->
        <div class="section">
            <h2 class="section-title">Visao Geral</h2>
            <div class="kpi-grid" id="kpiGrid"></div>
        </div>

        <!-- FUNIL -->
        <div class="section">
            <h2 class="section-title">Funil de Prospeccao</h2>
            <div class="two-col">
                <div class="card">
                    <div class="card-title">Pipeline (SQLite)</div>
                    <div id="funnelChart"></div>
                </div>
                <div class="card">
                    <div class="card-title">Status Original (Notion)</div>
                    <div id="notionStatusChart"></div>
                </div>
            </div>
        </div>

        <!-- NICHO + PRODUCAO -->
        <div class="section">
            <h2 class="section-title">Leads por Nicho e Producao</h2>
            <div class="two-col">
                <div class="card">
                    <div class="card-title">Distribuicao por Nicho</div>
                    <div id="nicheChart"></div>
                </div>
                <div class="card">
                    <div class="card-title">Sites Criados por Mes (Git)</div>
                    <div id="monthlyChart"></div>
                </div>
            </div>
        </div>

        <!-- PRD -->
        <div class="section">
            <h2 class="section-title">User Stories & Sites</h2>
            <div class="prd-grid" id="prdGrid"></div>
        </div>

        <!-- ATIVIDADE -->
        <div class="section">
            <h2 class="section-title">Atividade Recente (Git)</div>
            <div class="card">
                <div class="activity-list" id="activityList"></div>
            </div>
        </div>

    </main>
    <footer class="footer" id="footer"></footer>
</div>

<script>
(function() {
    'use strict';
    const $ = s => document.querySelector(s);

    const HASH = '0ab6d63e627eaf2f63a43514d1722ec6de93c49fc7452a9de39fe1882e2f0d98';

    async function sha256(text) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    async function checkPW(pw) { return await sha256(pw) === HASH; }

    function initGate() {
        if (sessionStorage.getItem('pa_crm_auth') === '1') { showDashboard(); loadData(); return; }
        const input = $('#gateInput'), btn = $('#gateBtn'), err = $('#gateError');
        async function tryLogin() {
            if (await checkPW(input.value)) {
                sessionStorage.setItem('pa_crm_auth', '1');
                showDashboard(); loadData();
            } else {
                err.textContent = 'Senha incorreta.'; input.value = ''; input.focus();
            }
        }
        btn.addEventListener('click', tryLogin);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
        input.focus();
    }

    function showDashboard() { $('#gate').classList.add('hidden'); $('#layout').classList.add('visible'); }

    async function loadData() {
        try {
            const r = await fetch('dashboard-data.json');
            if (!r.ok) throw new Error('Failed');
            render(await r.json());
        } catch(e) {
            document.querySelector('.main').innerHTML = '<div style="text-align:center;padding:3rem;color:#e05c5c"><h2>Erro ao carregar dados</h2><p>Rode generate_crm_data.py para atualizar.</p></div>';
        }
    }

    function render(DATA) {
        if (!DATA || !DATA.crm) return;
        const crm = DATA.crm;
        const updated = new Date(DATA.generated_at).toLocaleString('pt-BR', {timeZone: 'America/Sao_Paulo'});
        $('#updatedAt').textContent = 'Atualizado: ' + updated;
        $('#footer').textContent = 'Pixel Alchemy CRM | Dados de ' + updated;

        renderKPIs(crm);
        renderFunnel(crm.funnel);
        renderNotionStatus(crm.outreach_stats);
        renderNiches(crm.niche_distribution, crm.leads_summary);
        renderMonthly(crm.monthly_production);
        renderPRD(crm.prd, crm.leads_summary);
        renderActivity(crm.recent_activity);
    }

    function renderKPIs(c) {
        const ls = c.leads_summary;
        const os = c.outreach_stats;
        const fc = c.funnel.counts;
        const items = [
            { label: 'Total Leads', value: ls.total_leads, sub: 'no banco SQLite', color: '#1a1f2e' },
            { label: 'Com Telefone', value: ls.with_phone, sub: 'tem como contatar', color: '#5cbe7c' },
            { label: 'Lead', value: fc.Lead, sub: 'sem contato ainda', color: '#b5a6c8' },
            { label: 'Contatado', value: fc.Contatado, sub: 'msg/enviado', color: '#e07856' },
            { label: 'Respondeu', value: os.currently_respondeu, sub: '0 por enquanto', color: '#c4a68a' },
            { label: 'Proposta', value: os.currently_proposta, sub: 'enviadas ate agora', color: '#8ba888' },
        ];
        $('#kpiGrid').innerHTML = items.map(i => `
            <div class="kpi">
                <div class="kpi-label">${i.label}</div>
                <div class="kpi-value" style="color:${i.color}">${i.value}</div>
                <div class="kpi-sub">${i.sub}</div>
            </div>`).join('');
    }

    function renderFunnel(funnel) {
        const stages = funnel.stages;
        const counts = funnel.counts;
        const max = Math.max(...stages.map(s => counts[s] || 0), 1);
        const colors = ['#5cbe7c','#7dc95e','#a8c4a5','#d4c48a','#e0b87a','#e07060'];
        $('#funnelChart').innerHTML = stages.map((stage, i) => {
            const count = counts[stage] || 0;
            const pct = (count / max) * 100;
            const w = Math.max(10, pct);
            return `<div class="funnel-stage">
                <span class="funnel-label">${stage}</span>
                <div class="funnel-bar-wrap">
                    <div class="funnel-bar" style="width:${w}%;background:${colors[i]||'#888'}">
                        <span>${count}</span>
                    </div>
                </div>
                <span class="funnel-count">${count}</span>
            </div>`;
        }).join('') + `<div class="note-box"><strong>Origem:</strong> ${funnel.note}</div>`;
    }

    function renderNotionStatus(os) {
        const nb = os.notion_status_breakdown || {};
        const vals = Object.values(nb);
        const total = vals.reduce((a, b) => a + b, 0) || 1;
        const max = Math.max(...vals, 1);
        const colorMap = {
            'Lead':'#b5a6c8','Mensagem Pronta':'#e07856','Enviado':'#e05c5c',
            'Respondeu':'#5cbe7c','Reunião':'#8ba888','Proposta':'#c4a68a',
            'Fechado':'#1a1f2e','Site em Criação':'#65a3b8','Perdido':'#999'
        };
        $('#notionStatusChart').innerHTML = Object.entries(nb).sort((a,b)=>b[1]-a[1]).map(([s,c]) => {
            const pct = (c / max) * 100;
            const color = colorMap[s] || '#aaa';
            const pct2 = ((c / total) * 100).toFixed(1);
            return `<div class="status-row">
                <span class="status-name">${s}</span>
                <div class="status-bar-wrap">
                    <div class="status-bar" style="width:${pct}%;background:${color}"></div>
                </div>
                <span class="status-count">${c} (${pct2}%)</span>
            </div>`;
        }).join('');
    }

    function renderNiches(niches, ls) {
        const total = ls.total_leads || 1;
        const max = Math.max(...Object.values(niches),1);
        const colorMap = {
            'Veterinária':'#8ba888','Beleza':'#c4a68a','Harmonização':'#b5a6c8',
            'Dentista':'#e07856','Pet Shop':'#65a3b8','Barbearia':'#1a1f2e',
            'Padaria':'#d4a76a','Pizzaria':'#d4543b','Açougue':'#8b2500','Outros':'#aaa'
        };
        const sorted = Object.entries(niches).sort((a,b)=>b[1]-a[1]);
        $('#nicheChart').innerHTML = sorted.map(([n,c]) => {
            const pct = (c / max) * 100;
            const color = colorMap[n] || '#aaa';
            const pct2 = ((c/total)*100).toFixed(1)+'%';
            return `<div class="niche-row">
                <span class="niche-name" title="${n}">${n}</span>
                <div class="niche-bar-wrap">
                    <div class="niche-bar-fill" style="width:${pct}%;background:${color}">
                        <span>${pct2}</span>
                    </div>
                </div>
                <span class="niche-count">${c}</span>
            </div>`;
        }).join('');
    }

    function renderMonthly(monthly) {
        if (!monthly || monthly.length === 0) {
            $('#monthlyChart').innerHTML = '<div style="text-align:center;padding:2rem;color:#aaa;font-size:0.82rem">Sem dados de producao</div>';
            return;
        }
        const max = Math.max(...monthly.map(m=>m.count),1);
        $('#monthlyChart').innerHTML = `<div class="monthly-bars">` +
            monthly.map(m => {
                const pct = (m.count / max) * 100;
                const parts = m.month.split('-');
                const label = parts[1]+'/'+parts[0].slice(2);
                return `<div class="month-col">
                    <div class="month-count-label">${m.count}</div>
                    <div class="month-bar-wrap">
                        <div class="month-bar" style="height:${pct}%"></div>
                    </div>
                    <div class="month-label">${label}</div>
                </div>`;
            }).join('')+`</div>`;
    }

    function renderPRD(prd, ls) {
        const items = [
            { label: 'Stories Feitas', value: prd.stories_done, sub: `de ${prd.stories_total} totais`, color: '#5cbe7c' },
            { label: 'Stories Pendentes', value: prd.stories_pending, sub: 'restantes', color: '#e07856' },
            { label: 'Reviews Feitos', value: prd.reviews_done, sub: `de ${prd.reviews_total} totais`, color: '#8ba888' },
            { label: 'Demo Sites', value: ls.demo_sites_total, sub: 'pastas em site-demo/', color: '#1a1f2e' },
        ];
        $('#prdGrid').innerHTML = items.map(i => `
            <div class="prd-stat">
                <div class="prd-stat-value" style="color:${i.color}">${i.value}</div>
                <div class="prd-stat-label">${i.label} <span style="font-weight:400;font-size:0.62rem">${i.sub}</span></div>
            </div>`).join('');
    }

    function renderActivity(activities) {
        if (!activities || !Array.isArray(activities) || activities.length === 0) {
            $('#activityList').innerHTML = '<div style="text-align:center;padding:2rem;color:#aaa">Nenhuma atividade</div>';
            return;
        }
        const dotMap = {'feat':'dot-green','fix':'dot-terracotta','chore':'dot-clay','docs':'dot-sage','refactor':'dot-clay'};
        const list = document.createDocumentFragment();
        activities.forEach(a => {
            const msg = a.message || '';
            const prefix = msg.split(':')[0].toLowerCase();
            const color = dotMap[prefix] || 'dot-clay';
            const date = a.date ? a.date.split(' ')[0] : '';
            const item = document.createElement('div');
            item.className = 'activity-item';
            const dot = document.createElement('div');
            dot.className = `activity-dot ${color}`;
            const msgEl = document.createElement('div');
            msgEl.className = 'activity-msg';
            msgEl.textContent = msg;
            const dateEl = document.createElement('div');
            dateEl.className = 'activity-date';
            dateEl.textContent = date;
            item.appendChild(dot);
            item.appendChild(msgEl);
            item.appendChild(dateEl);
            list.appendChild(item);
        });
        $('#activityList').innerHTML = '';
        $('#activityList').appendChild(list);
    }

    initGate();
})();
</script>
</body>
</html>
