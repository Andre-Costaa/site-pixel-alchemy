<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Pixel Alchemy - CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
:root {
    --color-charcoal: #1a1f2e;
    --color-charcoal-light: #2a2f3e;
    --color-cream: #faf8f4;
    --color-cream-dark: #f0ede8;
    --color-terracotta: #e07856;
    --color-terracotta-light: #ed9d7f;
    --color-sage: #8ba888;
    --color-sage-light: #a8c4a5;
    --color-lavender: #b5a6c8;
    --color-clay: #c4a68a;
    --color-clay-light: #d9c4af;
    --color-red: #e05c5c;
    --color-green: #5cbe7c;

    --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
    --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --shadow-sm: 0 2px 8px rgba(26,31,46,0.06);
    --shadow-md: 0 4px 20px rgba(26,31,46,0.10);
    --shadow-lg: 0 8px 40px rgba(26,31,46,0.14);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: var(--font-body);
    background: var(--color-cream);
    color: var(--color-charcoal);
    min-height: 100vh;
}

/* ===== PASSWORD GATE ===== */
.gate {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--color-charcoal);
    display: flex; align-items: center; justify-content: center;
}
.gate.hidden { display: none; }
.gate-box {
    background: var(--color-cream);
    border-radius: var(--radius-lg);
    padding: 3rem;
    width: 380px;
    max-width: 95vw;
    box-shadow: var(--shadow-lg);
    text-align: center;
}
.gate-box h1 {
    font-family: var(--font-display);
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 0.3rem;
    background: var(--gradient-warm);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.gate-box p {
    color: #888;
    font-size: 0.88rem;
    margin-bottom: 1.8rem;
}
.gate-box input {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid var(--color-cream-dark);
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 0.5rem;
}
.gate-box input:focus { border-color: var(--color-terracotta); }
.gate-error {
    color: var(--color-red);
    font-size: 0.82rem;
    min-height: 1.2em;
    margin-bottom: 0.8rem;
}
.gate-btn {
    width: 100%;
    padding: 14px;
    background: var(--gradient-warm);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
}
.gate-btn:hover { opacity: 0.9; transform: translateY(-1px); }
.gate-btn:active { transform: translateY(0); }

/* ===== LAYOUT ===== */
.layout { display: none; flex-direction: column; min-height: 100vh; }
.layout.visible { display: flex; }

/* Header */
.header {
    background: var(--color-charcoal);
    color: #fff;
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
}
.header-brand {
    font-family: var(--font-display);
    font-size: 1.2rem;
    font-weight: 700;
    background: var(--gradient-warm);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.header-sub { font-size: 0.8rem; color: #aaa; }
.header-right { font-size: 0.78rem; color: #888; }

/* Main */
.main { flex: 1; padding: 2rem; max-width: 1100px; margin: 0 auto; width: 100%; }

/* Section */
.section { margin-bottom: 3rem; }
.section-title {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 1.2rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--color-cream-dark);
}

/* KPI Grid */
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
}
.kpi {
    background: #fff;
    border-radius: var(--radius-md);
    padding: 1.4rem 1.2rem;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--color-cream-dark);
}
.kpi-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #888;
    margin-bottom: 0.5rem;
}
.kpi-value {
    font-family: var(--font-display);
    font-size: 2rem;
    font-weight: 700;
    line-height: 1;
}
.kpi-value.highlight-terracotta { color: var(--color-terracotta); }
.kpi-value.highlight-sage { color: var(--color-sage); }
.kpi-value.highlight-red { color: var(--color-red); }
.kpi-value.highlight-green { color: var(--color-green); }
.kpi-value.highlight-lavender { color: var(--color-lavender); }
.kpi-sub { font-size: 0.75rem; color: #aaa; margin-top: 0.3rem; }
.kpi-bar {
    height: 6px;
    background: var(--color-cream-dark);
    border-radius: 3px;
    margin-top: 0.6rem;
    overflow: hidden;
}
.kpi-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--gradient-warm);
    transition: width 1s ease;
}

/* Funnel */
.funnel-container { background: #fff; border-radius: var(--radius-md); padding: 1.5rem; box-shadow: var(--shadow-sm); border: 1px solid var(--color-cream-dark); }
.funnel-stage {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 0.6rem;
}
.funnel-stage:last-child { margin-bottom: 0; }
.funnel-label {
    font-size: 0.82rem;
    font-weight: 500;
    width: 130px;
    flex-shrink: 0;
    color: var(--color-charcoal-light);
}
.funnel-bar-wrap {
    flex: 1;
    height: 32px;
    background: var(--color-cream-dark);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
}
.funnel-bar {
    height: 100%;
    border-radius: 6px;
    display: flex;
    align-items: center;
    padding-left: 10px;
    transition: width 1.2s ease;
    min-width: 40px;
}
.funnel-bar span {
    font-size: 0.78rem;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
}
.funnel-count {
    font-size: 0.82rem;
    font-weight: 600;
    width: 40px;
    text-align: right;
    flex-shrink: 0;
}

/* Two column */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
@media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

/* Card */
.card {
    background: #fff;
    border-radius: var(--radius-md);
    padding: 1.5rem;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--color-cream-dark);
}
.card-title {
    font-family: var(--font-display);
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 1rem;
    color: var(--color-charcoal);
}

/* Donut */
.donut-wrap { display: flex; align-items: center; gap: 1.5rem; }
.donut-legend { flex: 1; }
.legend-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.82rem;
    margin-bottom: 0.4rem;
}
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.legend-count { margin-left: auto; font-weight: 600; color: #666; }

/* Leads by niche bar */
.niche-bars { display: flex; flex-direction: column; gap: 0.6rem; }
.niche-row { display: flex; align-items: center; gap: 0.8rem; }
.niche-name { font-size: 0.8rem; width: 110px; flex-shrink: 0; font-weight: 500; }
.niche-bar-wrap { flex: 1; height: 22px; background: var(--color-cream-dark); border-radius: 4px; overflow: hidden; }
.niche-bar-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; padding: 0 8px; min-width: 28px; }
.niche-bar-fill span { font-size: 0.72rem; font-weight: 700; color: #fff; }
.niche-count { font-size: 0.8rem; font-weight: 600; width: 35px; text-align: right; flex-shrink: 0; }

/* Monthly chart */
.monthly-bars { display: flex; align-items: flex-end; gap: 1.5rem; height: 140px; padding-top: 0.5rem; }
.month-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
.month-bar-wrap { width: 100%; height: 100px; background: var(--color-cream-dark); border-radius: 6px 6px 0 0; overflow: hidden; display: flex; align-items: flex-end; }
.month-bar { width: 100%; background: var(--gradient-warm); border-radius: 6px 6px 0 0; transition: height 1s ease; min-height: 4px; }
.month-label { font-size: 0.75rem; font-weight: 600; color: #888; }
.month-count-label { font-size: 0.82rem; font-weight: 700; color: var(--color-charcoal); }

/* Activity feed */
.activity-list { display: flex; flex-direction: column; gap: 0; }
.activity-item {
    display: flex;
    gap: 0.8rem;
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--color-cream-dark);
    font-size: 0.82rem;
}
.activity-item:last-child { border-bottom: none; }
.activity-dot {
    width: 8px; height: 8px; border-radius: 50%;
    margin-top: 6px; flex-shrink: 0;
}
.dot-green { background: var(--color-green); }
.dot-terracotta { background: var(--color-terracotta); }
.dot-sage { background: var(--color-sage); }
.dot-clay { background: var(--color-clay); }
.activity-msg { flex: 1; line-height: 1.4; }
.activity-date { color: #aaa; font-size: 0.75rem; white-space: nowrap; }

/* Insight box */
.insight {
    background: #fffbeb;
    border: 1px solid #f5e6c0;
    border-radius: var(--radius-sm);
    padding: 1rem 1.2rem;
    font-size: 0.85rem;
    line-height: 1.5;
    margin-top: 1rem;
    color: #7a6520;
}
.insight strong { font-weight: 700; }

/* Footer */
.footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 0.75rem;
    color: #aaa;
    border-top: 1px solid var(--color-cream-dark);
}
    </style>
</head>
<body>

<!-- PASSWORD GATE -->
<div class="gate" id="gate">
    <div class="gate-box">
        <h1>Pixel Alchemy</h1>
        <p>Dashboard de Prospeccao. Insira a senha para acessar.</p>
        <input type="password" id="gateInput" placeholder="Senha" autocomplete="off">
        <div class="gate-error" id="gateError"></div>
        <button class="gate-btn" id="gateBtn">Entrar</button>
    </div>
</div>

<!-- DASHBOARD -->
<div class="layout" id="layout">

    <header class="header">
        <div>
            <div class="header-brand">Pixel Alchemy</div>
            <div class="header-sub">CRM de Prospeccao</div>
        </div>
        <div class="header-right" id="updatedAt"></div>
    </header>

    <main class="main">

        <!-- VISAO GERAL -->
        <div class="section">
            <h2 class="section-title">Visao Geral</h2>
            <div class="kpi-grid" id="kpiGrid"></div>
        </div>

        <!-- FUNIL + LEADS POR NICHO -->
        <div class="section">
            <h2 class="section-title">Funil de Prospeccao</h2>
            <div class="two-col">
                <div class="card">
                    <div class="card-title">Conversao por Etapa</div>
                    <div id="funnelChart"></div>
                </div>
                <div class="card">
                    <div class="card-title">Leads por Nicho</div>
                    <div id="nicheChart"></div>
                </div>
            </div>
        </div>

        <!-- OUTREACH + PRODUCAO MENSAL -->
        <div class="section">
            <h2 class="section-title">Outreach e Producao</h2>
            <div class="two-col">
                <div class="card">
                    <div class="card-title">Email Outreach</div>
                    <div id="outreachChart"></div>
                    <div class="insight" id="insightBox"></div>
                </div>
                <div class="card">
                    <div class="card-title">Sites Criados por Mes</div>
                    <div id="monthlyChart"></div>
                </div>
            </div>
        </div>

        <!-- ATIVIDADE RECENTE -->
        <div class="section">
            <h2 class="section-title">Atividade Recente</h2>
            <div class="card">
                <div class="activity-list" id="activityList"></div>
            </div>
        </div>

    </main>

    <footer class="footer" id="footer"></footer>
</div>

<script>
(function() {
    'use strict';

    const $ = s => document.querySelector(s);

    // ---- AUTH ----
    const HASH = '0ab6d63e627eaf2f63a43514d1722ec6de93c49fc7452a9de39fe1882e2f0d98';

    async function sha256(text) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    async function checkPW(pw) {
        return await sha256(pw) === HASH;
    }

    function initGate() {
        if (sessionStorage.getItem('pa_crm_auth') === '1') {
            showDashboard(); loadData(); return;
        }
        const input = $('#gateInput'), btn = $('#gateBtn'), err = $('#gateError');
        async function tryLogin() {
            const pw = input.value;
            if (!pw) { err.textContent = 'Digite a senha.'; return; }
            if (await checkPW(pw)) {
                sessionStorage.setItem('pa_crm_auth', '1');
                showDashboard(); loadData();
            } else {
                err.textContent = 'Senha incorreta.'; input.value = ''; input.focus();
            }
        }
        btn.addEventListener('click', tryLogin);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
        input.focus();
    }

    function showDashboard() {
        $('#gate').classList.add('hidden');
        $('#layout').classList.add('visible');
    }

    // ---- DATA ----
    let DATA = null;

    async function loadData() {
        try {
            const r = await fetch('dashboard-data.json');
            if (!r.ok) throw new Error('Failed');
            DATA = await r.json();
            render();
        } catch(e) {
            document.querySelector('.main').innerHTML =
                '<div style="text-align:center;padding:3rem;color:#e05c5c"><h2>Erro ao carregar dados</h2><p>Verifique sua conexao.</p></div>';
        }
    }

    // ---- RENDER ----
    function render() {
        if (!DATA || !DATA.crm) return;
        const crm = DATA.crm;
        const updated = new Date(DATA.crm.generated_at || DATA.generated_at).toLocaleString('pt-BR', {timeZone: 'America/Sao_Paulo'});
        $('#updatedAt').textContent = 'Atualizado: ' + updated;
        $('#footer').textContent = 'Pixel Alchemy CRM | ' + updated;

        renderKPIs(crm);
        renderFunnel(crm.funnel);
        renderNicheChart(crm.leads_summary);
        renderOutreach(crm.outreach_stats);
        renderMonthly(crm.monthly_production);
        renderActivity(crm.recent_activity);
    }

    function renderKPIs(c) {
        const grid = $('#kpiGrid');
        const outreach = c.outreach_stats;
        const leads = c.leads_summary;
        const funnel = c.funnel.counts;

        const items = [
            { label: 'Total Leads', value: leads.total_leads, sub: 'em pipeline', cls: '' },
            { label: 'Contatados', value: leads.contacted, sub: 'receberam email', cls: 'highlight-terracotta' },
            { label: 'Pendentes', value: leads.pending, sub: 'aguardando contato', cls: 'highlight-sage' },
            { label: 'Taxa Resposta', value: outreach.response_rate, sub: outreach.responses_received + ' respostas', cls: 'highlight-lavender' },
            { label: 'Reunioes', value: outreach.meetings_booked, sub: 'agendadas', cls: 'highlight-sage' },
            { label: 'Propostas', value: outreach.proposals_sent, sub: 'enviadas', cls: 'highlight-clay' },
        ];

        // conversion funnel insight
        const sent = funnel.Enviado || 0;
        const replied = funnel.Respondeu || 0;
        const meetings = funnel.Reunião || 0;
        const proposals = funnel.Proposta || 0;
        const closed = funnel.Fechado || 0;
        const conversion = sent > 0 ? ((replied / sent) * 100).toFixed(1) : '0';

        grid.innerHTML = items.map(i =>
            `<div class="kpi">
                <div class="kpi-label">${i.label}</div>
                <div class="kpi-value ${i.cls}">${i.value}</div>
                <div class="kpi-sub">${i.sub}</div>
            </div>`
        ).join('');
    }

    function renderFunnel(funnel) {
        const stages = funnel.stages.filter(s => !['Site em Criação','Site Pronto'].includes(s));
        const counts = funnel.counts;
        const max = Math.max(...stages.map(s => counts[s] || 0), 1);

        // Color gradient: green -> yellow -> red as funnel narrows
        const colors = ['#5cbe7c','#7dc95e','#a8c4a5','#c4d49a','#d4c48a','#e0b87a','#e0a06a','#e08856','#e07060','#e05c5c'];

        $('#funnelChart').innerHTML = stages.map((stage, i) => {
            const count = counts[stage] || 0;
            const pct = (count / max) * 100;
            const color = colors[Math.min(i, colors.length - 1)];
            const w = Math.max(8, pct);
            return `<div class="funnel-stage">
                <span class="funnel-label">${stage}</span>
                <div class="funnel-bar-wrap">
                    <div class="funnel-bar" style="width:${w}%;background:${color}">
                        <span>${count}</span>
                    </div>
                </div>
                <span class="funnel-count">${count}</span>
            </div>`;
        }).join('');
    }

    function renderNicheChart(leads) {
        const byNiche = leads.by_niche;
        const total = leads.total_leads;
        const max = Math.max(...Object.values(byNiche), 1);

        const colors = {
            'Veterinaria': '#8ba888',
            'Harmonizacao': '#b5a6c8',
            'Dentista': '#e07856',
            'Beleza': '#c4a68a',
            'Barbearia': '#1a1f2e',
            'Pet Shop': '#65a3b8',
            'Pizzaria': '#d4543b',
            'Padaria': '#d4a76a',
            'Acougue': '#8b2500',
            'Outro': '#888'
        };

        const sorted = Object.entries(byNiche).sort((a,b) => b[1] - a[1]);

        $('#nicheChart').innerHTML = `<div class="niche-bars">` +
            sorted.map(([niche, count]) => {
                const pct = (count / max) * 100;
                const color = colors[niche] || '#888';
                const pctLabel = ((count / total) * 100).toFixed(1) + '%';
                return `<div class="niche-row">
                    <span class="niche-name">${niche}</span>
                    <div class="niche-bar-wrap">
                        <div class="niche-bar-fill" style="width:${pct}%;background:${color}">
                            <span>${pctLabel}</span>
                        </div>
                    </div>
                    <span class="niche-count">${count}</span>
                </div>`;
            }).join('') + `</div>`;
    }

    function renderOutreach(stats) {
        const items = [
            { label: 'Emails Enviados', value: stats.emails_sent, color: '#8ba888' },
            { label: 'Respostas', value: stats.responses_received, color: '#b5a6c8' },
            { label: 'Reunioes', value: stats.meetings_booked, color: '#e07856' },
            { label: 'Propostas', value: stats.proposals_sent, color: '#c4a68a' },
            { label: 'Fechados', value: stats.deals_closed, color: '#5cbe7c' },
        ];

        const max = Math.max(...items.map(i => i.value), 1);

        $('#outreachChart').innerHTML = `<div class="niche-bars">` +
            items.map(i => {
                const pct = (i.value / max) * 100;
                return `<div class="niche-row">
                    <span class="niche-name">${i.label}</span>
                    <div class="niche-bar-wrap">
                        <div class="niche-bar-fill" style="width:${pct}%;background:${i.color}">
                            <span>${i.value}</span>
                        </div>
                    </div>
                    <span class="niche-count">${i.value}</span>
                </div>`;
            }).join('') + `</div>`;

        // Insight
        const rate = stats.response_rate;
        const insight = stats.emails_sent === 0
            ? '<strong>Sem emails enviados ainda.</strong> Comece a enviar para ver metricas de conversao.'
            : stats.deals_closed === 0 && stats.proposals_sent === 0
            ? `<strong>Gargalo identificado:</strong> ${rate} de taxa de resposta, mas nenhuma proposta enviada. ` +
              `Revise as ${stats.responses_received} respostas e avance para reuniao/proposta.`
            : stats.deals_closed === 0
            ? `<strong>${stats.proposals_sent} proposta(s) enviada(s), nenhum fechamento ainda.</strong> Acompanhe feedbacks dos clientes.`
            : `<strong>${stats.deals_closed} fechamento(s)!</strong> Parabens, o funil esta convertendo.`;

        $('#insightBox').innerHTML = insight;
    }

    function renderMonthly(monthly) {
        const max = Math.max(...monthly.map(m => m.count), 1);

        $('#monthlyChart').innerHTML = `<div class="monthly-bars">` +
            monthly.map(m => {
                const pct = (m.count / max) * 100;
                const monthLabel = m.month.split('-')[1] + '/' + m.month.split('-')[0].slice(2);
                return `<div class="month-col">
                    <div class="month-count-label">${m.count}</div>
                    <div class="month-bar-wrap">
                        <div class="month-bar" style="height:${pct}%"></div>
                    </div>
                    <div class="month-label">${monthLabel}</div>
                    <div style="font-size:0.7rem;color:#aaa;margin-top:0.2rem">${m.cumulative_count} acum.</div>
                </div>`;
            }).join('') + `</div>`;
    }

    function renderActivity(activities) {
        const typeColors = {
            'site_created': 'dot-green',
            'email_sent': 'dot-terracotta',
            'response': 'dot-sage',
            'meeting': 'dot-clay',
            'chore': 'dot-clay',
            'other': 'dot-clay'
        };

        $('#activityList').innerHTML = activities.map(a => {
            const color = typeColors[a.type] || 'dot-clay';
            return `<div class="activity-item">
                <div class="activity-dot ${color}"></div>
                <div class="activity-msg">${a.message}</div>
                <div class="activity-date">${a.date}</div>
            </div>`;
        }).join('');
    }

    // Boot
    initGate();
})();
</script>
</body>
</html>
